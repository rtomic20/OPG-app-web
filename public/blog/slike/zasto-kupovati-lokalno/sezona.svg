<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Ilustracija sezonske ponude kroz godinu: jagode u proljeće, rajčice ljeti, bundeve u jesen, jabuke i med zimi">
  <rect width="1200" height="600" fill="#FAF7F2"/>
  <rect x="20" y="20" width="1160" height="560" rx="16" fill="#EAF2E0"/>

  <text x="600" y="86" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="38" fill="#2D5016">Sezona kroz godinu</text>

  <!-- crta godine -->
  <path d="M120 330 L1080 330" stroke="#7BA562" stroke-width="4" stroke-linecap="round"/>

  <!-- PROLJEĆE -->
  <g>
    <circle cx="240" cy="330" r="10" fill="#5A8B35"/>
    <circle cx="240" cy="228" r="62" fill="#FAF7F2" stroke="#7BA562" stroke-width="3"/>
    <path d="M240 214 c -18 -20, -34 4, -14 16 c -14 8, -4 28, 14 20 c 18 8, 28 -12, 14 -20 c 20 -12, 4 -36, -14 -16 z" fill="#D6503A"/>
    <path d="M240 200 l0 -12 M232 202 q8 -12 18 -6" stroke="#2D5016" stroke-width="4" fill="none" stroke-linecap="round"/>
    <text x="240" y="382" text-anchor="middle" font-family="system-ui, 'Segoe UI', sans-serif" font-size="24" fill="#2D5016" font-weight="600">proljeće</text>
    <text x="240" y="410" text-anchor="middle" font-family="system-ui, 'Segoe UI', sans-serif" font-size="20" fill="#5A8B35">jagode, špinat</text>
  </g>

  <!-- LJETO -->
  <g>
    <circle cx="480" cy="330" r="10" fill="#5A8B35"/>
    <circle cx="480" cy="228" r="62" fill="#FAF7F2" stroke="#7BA562" stroke-width="3"/>
    <circle cx="480" cy="234" r="34" fill="#C8442F"/>
    <path d="M480 196 l0 -14 M470 200 q10 -14 22 -8" stroke="#2D5016" stroke-width="5" fill="none" stroke-linecap="round"/>
    <text x="480" y="382" text-anchor="middle" font-family="system-ui, 'Segoe UI', sans-serif" font-size="24" fill="#2D5016" font-weight="600">ljeto</text>
    <text x="480" y="410" text-anchor="middle" font-family="system-ui, 'Segoe UI', sans-serif" font-size="20" fill="#5A8B35">rajčice, tikvice</text>
  </g>

  <!-- JESEN -->
  <g>
    <circle cx="720" cy="330" r="10" fill="#5A8B35"/>
    <circle cx="720" cy="228" r="62" fill="#FAF7F2" stroke="#7BA562" stroke-width="3"/>
    <ellipse cx="720" cy="238" rx="40" ry="30" fill="#D9762F"/>
    <ellipse cx="720" cy="238" rx="14" ry="30" fill="#E0873C" opacity="0.7"/>
    <path d="M720 206 l0 -14" stroke="#4E7A38" stroke-width="6" stroke-linecap="round"/>
    <text x="720" y="382" text-anchor="middle" font-family="system-ui, 'Segoe UI', sans-serif" font-size="24" fill="#2D5016" font-weight="600">jesen</text>
    <text x="720" y="410" text-anchor="middle" font-family="system-ui, 'Segoe UI', sans-serif" font-size="20" fill="#5A8B35">bundeve, grožđe</text>
  </g>

  <!-- ZIMA -->
  <g>
    <circle cx="960" cy="330" r="10" fill="#5A8B35"/>
    <circle cx="960" cy="228" r="62" fill="#FAF7F2" stroke="#7BA562" stroke-width="3"/>
    <rect x="940" y="216" width="40" height="42" rx="6" fill="#E8A33D"/>
    <rect x="936" y="206" width="48" height="12" rx="4" fill="#8A6A44"/>
    <text x="960" y="382" text-anchor="middle" font-family="system-ui, 'Segoe UI', sans-serif" font-size="24" fill="#2D5016" font-weight="600">zima</text>
    <text x="960" y="410" text-anchor="middle" font-family="system-ui, 'Segoe UI', sans-serif" font-size="20" fill="#5A8B35">jabuke, med</text>
  </g>

  <text x="600" y="502" text-anchor="middle" font-family="system-ui, 'Segoe UI', sans-serif" font-size="23" fill="#4F4F49">Lokalna ponuda mijenja se kroz godinu — zato se isplati pratiti što je sada dostupno.</text>
</svg>
