<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Sezonska ponuda kroz godinu: jagode u proljeće, rajčice ljeti, bundeve u jesen, jabuke i med zimi">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDF9F1"/>
      <stop offset="100%" stop-color="#EFF5E6"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A8C68C"/>
      <stop offset="25%" stop-color="#7BA562"/>
      <stop offset="60%" stop-color="#C88A3C"/>
      <stop offset="100%" stop-color="#8FA8B8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bg2)"/>
  <rect x="18" y="18" width="1164" height="564" rx="20" fill="none" stroke="#DCE7CE" stroke-width="2"/>

  <text x="600" y="80" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#2D5016">Sezona kroz godinu</text>
  <text x="600" y="112" text-anchor="middle" font-family="system-ui, 'Segoe UI', sans-serif" font-size="21" fill="#6C8A57">što lokalni proizvođači nude i kada</text>

  <!-- vremenska crta -->
  <path d="M150 336 L1050 336" stroke="url(#line)" stroke-width="6" stroke-linecap="round"/>

  <g font-family="system-ui, 'Segoe UI', sans-serif">
    <!-- PROLJEĆE -->
    <g>
      <circle cx="255" cy="336" r="13" fill="#FDF9F1" stroke="#7BA562" stroke-width="5"/>
      <circle cx="255" cy="232" r="66" fill="#FFFFFF" stroke="#DCE7CE" stroke-width="3"/>
      <path d="M255 214 c -20 -22, -38 5, -15 18 c -16 9, -5 32, 15 23 c 20 9, 31 -14, 15 -23 c 23 -13, 5 -40, -15 -18 z" fill="#D6503A"/>
      <g fill="#F6E2C8">
        <circle cx="248" cy="236" r="2.6"/><circle cx="262" cy="240" r="2.6"/>
        <circle cx="255" cy="252" r="2.6"/><circle cx="242" cy="250" r="2.6"/>
        <circle cx="268" cy="228" r="2.6"/>
      </g>
      <path d="M255 199 l0 -13 M243 202 q12 -14 25 -8" stroke="#3F6B2A" stroke-width="5" fill="none" stroke-linecap="round"/>
      <text x="255" y="392" text-anchor="middle" font-size="25" fill="#2D5016" font-weight="600">proljeće</text>
      <text x="255" y="420" text-anchor="middle" font-size="20" fill="#6C8A57">jagode, špinat</text>
    </g>

    <!-- LJETO -->
    <g>
      <circle cx="485" cy="336" r="13" fill="#FDF9F1" stroke="#5A8B35" stroke-width="5"/>
      <circle cx="485" cy="232" r="66" fill="#FFFFFF" stroke="#DCE7CE" stroke-width="3"/>
      <circle cx="485" cy="240" r="36" fill="#C8442F"/>
      <ellipse cx="473" cy="228" rx="11" ry="8" fill="#E0705A" opacity="0.55"/>
      <path d="M485 200 l0 -14" stroke="#3F6B2A" stroke-width="6" stroke-linecap="round"/>
      <path d="M470 205 q15 -16 30 -9" stroke="#3F6B2A" stroke-width="6" fill="none" stroke-linecap="round"/>
      <text x="485" y="392" text-anchor="middle" font-size="25" fill="#2D5016" font-weight="600">ljeto</text>
      <text x="485" y="420" text-anchor="middle" font-size="20" fill="#6C8A57">rajčice, tikvice</text>
    </g>

    <!-- JESEN -->
    <g>
      <circle cx="715" cy="336" r="13" fill="#FDF9F1" stroke="#C88A3C" stroke-width="5"/>
      <circle cx="715" cy="232" r="66" fill="#FFFFFF" stroke="#DCE7CE" stroke-width="3"/>
      <ellipse cx="715" cy="244" rx="44" ry="32" fill="#D9762F"/>
      <ellipse cx="715" cy="244" rx="15" ry="32" fill="#E89448" opacity="0.65"/>
      <ellipse cx="686" cy="244" rx="10" ry="28" fill="#C36824" opacity="0.5"/>
      <ellipse cx="744" cy="244" rx="10" ry="28" fill="#C36824" opacity="0.5"/>
      <path d="M715 210 l0 -14" stroke="#3F6B2A" stroke-width="7" stroke-linecap="round"/>
      <text x="715" y="392" text-anchor="middle" font-size="25" fill="#2D5016" font-weight="600">jesen</text>
      <text x="715" y="420" text-anchor="middle" font-size="20" fill="#6C8A57">bundeve, grožđe</text>
    </g>

    <!-- ZIMA -->
    <g>
      <circle cx="945" cy="336" r="13" fill="#FDF9F1" stroke="#8FA8B8" stroke-width="5"/>
      <circle cx="945" cy="232" r="66" fill="#FFFFFF" stroke="#DCE7CE" stroke-width="3"/>
      <circle cx="921" cy="238" r="22" fill="#C86A2A"/>
      <path d="M921 214 l0 -10" stroke="#3F6B2A" stroke-width="4" stroke-linecap="round"/>
      <rect x="945" y="220" width="38" height="40" rx="6" fill="#E8A33D"/>
      <rect x="945" y="220" width="13" height="40" rx="6" fill="#F0B75C" opacity="0.7"/>
      <rect x="941" y="210" width="46" height="12" rx="4" fill="#8A6A44"/>
      <text x="945" y="392" text-anchor="middle" font-size="25" fill="#2D5016" font-weight="600">zima</text>
      <text x="945" y="420" text-anchor="middle" font-size="20" fill="#6C8A57">jabuke, med</text>
    </g>
  </g>

  <rect x="240" y="472" width="720" height="60" rx="14" fill="#EAF2E0"/>
  <text x="600" y="509" text-anchor="middle" font-family="system-ui, 'Segoe UI', sans-serif" font-size="22" fill="#2D5016">Lokalna ponuda mijenja se kroz godinu — zato se isplati pratiti što je sada dostupno.</text>
</svg>
