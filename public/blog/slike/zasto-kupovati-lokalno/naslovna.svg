  <g>
    <rect x="352" y="402" width="164" height="68" rx="8" fill="#C09257"/>
    <path d="M352 424 h164 M352 446 h164" stroke="#A87F49" stroke-width="3"/>
    <rect x="352" y="402" width="164" height="68" rx="8" fill="none" stroke="#8A6A44" stroke-width="3"/>
    <circle cx="390" cy="396" r="26" fill="#C8442F"/>
    <circle cx="383" cy="388" r="8" fill="#DB5C45" opacity="0.6"/>
    <circle cx="440" cy="389" r="28" fill="#D6503A"/>
    <circle cx="432" cy="380" r="9" fill="#E8705A" opacity="0.6"/>
    <circle cx="491" cy="397" r="25" fill="#C8442F"/>
    <path d="M440 361 l0 -13" stroke="#3F6B2A" stroke-width="5" stroke-linecap="round"/>
    <path d="M429 364 q11 -13 23 -7" stroke="#3F6B2A" stroke-width="5" fill="none" stroke-linecap="round"/>
