    <path d="M651 380 l4 -10 l8 4" stroke="#3F6B2A" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- GAJBA 3: jabuke, med, jaja -->
  <g>
    <rect x="694" y="414" width="150" height="56" rx="8" fill="#C09257"/>
    <path d="M694 432 h150 M694 452 h150" stroke="#A87F49" stroke-width="3"/>
    <rect x="694" y="414" width="150" height="56" rx="8" fill="none" stroke="#8A6A44" stroke-width="3"/>
    <circle cx="726" cy="408" r="23" fill="#D9762F"/>
    <circle cx="720" cy="400" r="7" fill="#EB9550" opacity="0.6"/>
    <circle cx="770" cy="404" r="24" fill="#C86A2A"/>
    <path d="M770 378 l0 -11" stroke="#3F6B2A" stroke-width="5" stroke-linecap="round"/>
