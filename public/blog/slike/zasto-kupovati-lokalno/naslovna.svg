  <!-- ploča s natpisom -->
  <g>
    <rect x="452" y="502" width="296" height="52" rx="10" fill="#FDF6E9" stroke="#2D5016" stroke-width="3"/>
    <text x="600" y="536" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#2D5016">domaće, iz tvog kraja</text>
  </g>
