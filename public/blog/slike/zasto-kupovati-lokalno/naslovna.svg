  <path d="M336 296 L864 296 L858 306 L342 306 Z" fill="#2D5016" opacity="0.18"/>
  <!-- stupovi -->
  <rect x="356" y="344" width="11" height="216" rx="3" fill="#6F5436"/>
  <rect x="833" y="344" width="11" height="216" rx="3" fill="#6F5436"/>

