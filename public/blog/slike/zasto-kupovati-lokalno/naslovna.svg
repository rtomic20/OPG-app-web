    <rect x="800" y="376" width="14" height="40" rx="6" fill="#F0B75C" opacity="0.7"/>
    <rect x="796" y="366" width="46" height="12" rx="4" fill="#8A6A44"/>
    <rect x="806" y="390" width="26" height="12" rx="2" fill="#FDF6E9" opacity="0.9"/>
