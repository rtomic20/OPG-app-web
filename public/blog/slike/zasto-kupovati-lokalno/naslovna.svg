<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Ilustracija: štand s domaćim proizvodima pred poljima i brdima u zalazak sunca">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDF6E9"/>
      <stop offset="55%" stop-color="#FAF0DC"/>
      <stop offset="100%" stop-color="#EDF3E2"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8C68C"/>
      <stop offset="100%" stop-color="#93B878"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7BA562"/>
      <stop offset="100%" stop-color="#649050"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5A8B35"/>
      <stop offset="100%" stop-color="#47702A"/>
    </linearGradient>
    <linearGradient id="awning" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F1E6"/>
      <stop offset="100%" stop-color="#E6DFCC"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5C763" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F5C763" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#sky)"/>

  <!-- sunce i topli sjaj -->
  <circle cx="905" cy="168" r="180" fill="url(#glow)"/>
  <circle cx="905" cy="168" r="52" fill="#F3C25A"/>

  <!-- ptice -->
  <g stroke="#8FA37E" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.75">
    <path d="M232 128 q12 -10 24 0 q12 -10 24 0"/>
    <path d="M300 96 q9 -8 18 0 q9 -8 18 0"/>
    <path d="M186 176 q9 -8 18 0 q9 -8 18 0"/>
  </g>

  <!-- brda, tri sloja dubine -->
  <path d="M0 330 C 130 272, 268 348, 402 318 C 540 286, 632 336, 760 310 C 900 282, 1060 330, 1200 300 L1200 630 L0 630 Z" fill="url(#hillFar)"/>
  <path d="M0 392 C 160 344, 316 408, 470 380 C 636 350, 780 398, 934 374 C 1050 356, 1140 382, 1200 370 L1200 630 L0 630 Z" fill="url(#hillMid)"/>
  <path d="M0 452 C 190 410, 372 470, 560 444 C 760 416, 928 462, 1084 442 C 1140 435, 1176 440, 1200 436 L1200 630 L0 630 Z" fill="url(#hillNear)"/>

  <!-- redovi nasada -->
  <g stroke="#3C6222" stroke-width="3.5" stroke-linecap="round" opacity="0.35">
    <path d="M40 512 C 320 476, 760 476, 1170 498"/>
    <path d="M40 548 C 320 512, 760 512, 1170 534"/>
    <path d="M40 584 C 320 548, 760 548, 1170 570"/>
  </g>

  <!-- čempresi -->
