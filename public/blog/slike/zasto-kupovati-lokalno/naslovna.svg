  <path d="M336 296 L864 296 L836 344 L364 344 Z" fill="url(#awning)"/>
  <g fill="#C9482F">
    <path d="M364 344 L392 344 L400 296 L372 296 Z" opacity="0.85"/>
    <path d="M452 344 L480 344 L484 296 L456 296 Z" opacity="0.85"/>
    <path d="M540 344 L568 344 L568 296 L540 296 Z" opacity="0.85"/>
    <path d="M628 344 L656 344 L652 296 L624 296 Z" opacity="0.85"/>
    <path d="M716 344 L744 344 L736 296 L708 296 Z" opacity="0.85"/>
    <path d="M804 344 L832 344 L820 296 L792 296 Z" opacity="0.85"/>
