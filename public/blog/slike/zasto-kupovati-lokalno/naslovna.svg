  <!-- stablo desno -->
  <g>
    <rect x="1063" y="332" width="11" height="46" rx="3" fill="#5B4A32"/>
    <circle cx="1068" cy="312" r="40" fill="#4A7A31"/>
    <circle cx="1044" cy="326" r="26" fill="#568A38"/>
    <circle cx="1092" cy="328" r="24" fill="#3F6B2A"/>
