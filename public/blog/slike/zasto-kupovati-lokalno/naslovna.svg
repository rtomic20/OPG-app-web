    <ellipse cx="118" cy="300" rx="19" ry="58" fill="#3F6B2A"/>
    <rect x="114" y="352" width="8" height="26" fill="#5B4A32"/>
    <ellipse cx="163" cy="318" rx="15" ry="44" fill="#4A7A31"/>
    <rect x="160" y="358" width="7" height="22" fill="#5B4A32"/>
