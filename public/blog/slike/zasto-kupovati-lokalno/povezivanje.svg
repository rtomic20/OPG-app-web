<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Kupac traži domaće, OPG traži kupca, Tržnjak ih povezuje">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDF9F1"/>
      <stop offset="100%" stop-color="#EFF5E6"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3D6B1E"/>
      <stop offset="100%" stop-color="#24400F"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5A8B35" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5A8B35" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="560" fill="url(#bg3)"/>
  <rect x="18" y="18" width="1164" height="524" rx="20" fill="none" stroke="#DCE7CE" stroke-width="2"/>

  <!-- veze -->
  <g stroke="#A8C68C" stroke-width="5" stroke-linecap="round" fill="none" stroke-dasharray="2 16">
    <path d="M356 262 L500 262"/>
    <path d="M700 262 L844 262"/>
  </g>
  <path d="M492 252 l18 10 l-18 10 z" fill="#5A8B35"/>
  <path d="M708 252 l-18 10 l18 10 z" fill="#5A8B35"/>

  <!-- KUPAC -->
  <g>
    <circle cx="248" cy="262" r="104" fill="url(#halo)"/>
    <circle cx="248" cy="262" r="88" fill="#FFFFFF" stroke="#DCE7CE" stroke-width="3"/>
    <circle cx="248" cy="236" r="29" fill="#5A8B35"/>
    <path d="M199 312 c 0 -33, 22 -52, 49 -52 c 27 0, 49 19, 49 52 z" fill="#5A8B35"/>
    <!-- povecalo -->
    <circle cx="292" cy="264" r="21" fill="#FDF9F1" stroke="#2D5016" stroke-width="7"/>
    <path d="M307 279 l19 19" stroke="#2D5016" stroke-width="8" stroke-linecap="round"/>
    <text x="248" y="404" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#2D5016">Kupac</text>
    <text x="248" y="436" text-anchor="middle" font-family="system-ui, 'Segoe UI', sans-serif" font-size="21" fill="#6C8A57">traži domaće</text>
  </g>

  <!-- TRŽNJAK -->
  <g>
    <circle cx="600" cy="262" r="102" fill="url(#halo)"/>
    <circle cx="600" cy="262" r="86" fill="url(#core)"/>
    <!-- tenda -->
    <path d="M549 250 L600 210 L651 250 Z" fill="#EFF5E6"/>
    <path d="M556 250 h88 v10 h-88 z" fill="#C9482F"/>
    <rect x="560" y="260" width="80" height="52" rx="5" fill="#EFF5E6"/>
    <rect x="586" y="282" width="28" height="30" rx="3" fill="#24400F"/>
    <circle cx="576" cy="274" r="6" fill="#5A8B35"/>
    <circle cx="624" cy="274" r="6" fill="#C9482F"/>
    <text x="600" y="404" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#2D5016">Tržnjak</text>
    <text x="600" y="436" text-anchor="middle" font-family="system-ui, 'Segoe UI', sans-serif" font-size="21" fill="#6C8A57">povezuje</text>
  </g>

  <!-- OPG -->
  <g>
    <circle cx="952" cy="262" r="104" fill="url(#halo)"/>
    <circle cx="952" cy="262" r="88" fill="#FFFFFF" stroke="#DCE7CE" stroke-width="3"/>
    <path d="M898 264 l54 -44 l54 44 z" fill="#3F6B2A"/>
    <rect x="910" y="264" width="84" height="52" rx="4" fill="#5A8B35"/>
    <rect x="938" y="284" width="28" height="32" rx="3" fill="#EFF5E6"/>
    <rect x="916" y="274" width="18" height="16" rx="2" fill="#EFF5E6" opacity="0.85"/>
    <rect x="970" y="274" width="18" height="16" rx="2" fill="#EFF5E6" opacity="0.85"/>
    <circle cx="1004" cy="232" r="15" fill="#D9762F"/>
    <circle cx="1020" cy="252" r="11" fill="#C8442F"/>
    <text x="952" y="404" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#2D5016">OPG</text>
    <text x="952" y="436" text-anchor="middle" font-family="system-ui, 'Segoe UI', sans-serif" font-size="21" fill="#6C8A57">traži kupca</text>
  </g>

  <rect x="230" y="478" width="740" height="52" rx="14" fill="#EAF2E0"/>
  <text x="600" y="511" text-anchor="middle" font-family="system-ui, 'Segoe UI', sans-serif" font-size="21" fill="#2D5016">Jedno mjesto umjesto pretraživanja više društvenih mreža i stranica.</text>
</svg>
