<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Ilustracija: kupac traži domaće, OPG traži kupca, Tržnjak ih povezuje">
  <rect width="1200" height="560" fill="#FAF7F2"/>
  <rect x="20" y="20" width="1160" height="520" rx="16" fill="#EAF2E0"/>

  <!-- KUPAC -->
  <g>
    <circle cx="250" cy="250" r="96" fill="#FAF7F2" stroke="#7BA562" stroke-width="4"/>
    <circle cx="250" cy="222" r="30" fill="#5A8B35"/>
    <path d="M198 300 c 0 -34, 24 -54, 52 -54 c 28 0, 52 20, 52 54 z" fill="#5A8B35"/>
    <path d="M300 268 l26 26" stroke="#2D5016" stroke-width="7" stroke-linecap="round"/>
    <circle cx="294" cy="262" r="20" fill="none" stroke="#2D5016" stroke-width="7"/>
    <text x="250" y="392" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#2D5016">Kupac</text>
    <text x="250" y="424" text-anchor="middle" font-family="system-ui, 'Segoe UI', sans-serif" font-size="21" fill="#5A8B35">traži domaće</text>
  </g>

  <!-- TRŽNJAK, sredina -->
  <g>
    <circle cx="600" cy="250" r="82" fill="#2D5016"/>
    <path d="M556 236 l44 -34 l44 34 z" fill="#EAF2E0"/>
    <rect x="566" y="236" width="68" height="52" rx="5" fill="#EAF2E0"/>
    <rect x="588" y="256" width="24" height="32" rx="3" fill="#2D5016"/>
    <text x="600" y="392" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#2D5016">Tržnjak</text>
    <text x="600" y="424" text-anchor="middle" font-family="system-ui, 'Segoe UI', sans-serif" font-size="21" fill="#5A8B35">povezuje</text>
  </g>

  <!-- OPG -->
  <g>
    <circle cx="950" cy="250" r="96" fill="#FAF7F2" stroke="#7BA562" stroke-width="4"/>
    <path d="M898 254 l52 -42 l52 42 z" fill="#4E7A38"/>
    <rect x="910" y="254" width="80" height="52" rx="4" fill="#5A8B35"/>
    <rect x="936" y="274" width="28" height="32" rx="3" fill="#EAF2E0"/>
    <text x="950" y="392" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#2D5016">OPG</text>
    <text x="950" y="424" text-anchor="middle" font-family="system-ui, 'Segoe UI', sans-serif" font-size="21" fill="#5A8B35">traži kupca</text>
  </g>

  <!-- veze -->
  <g stroke="#7BA562" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M352 250 L510 250" stroke-dasharray="12 12"/>
    <path d="M690 250 L848 250" stroke-dasharray="12 12"/>
  </g>
  <path d="M498 240 l16 10 l-16 10 z" fill="#5A8B35"/>
  <path d="M702 240 l-16 10 l16 10 z" fill="#5A8B35"/>

  <text x="600" y="490" text-anchor="middle" font-family="system-ui, 'Segoe UI', sans-serif" font-size="23" fill="#4F4F49">Jedno mjesto umjesto pretraživanja više društvenih mreža i stranica.</text>
</svg>
